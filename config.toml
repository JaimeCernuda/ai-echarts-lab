baseURL = 'http://example.org/'
languageCode = 'en-us'
title = 'ECharts Lab'
theme = []

[params]
  description = "A specialized research lab for ECharts visualizations."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data/viz"
    target = "content/experiments"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
